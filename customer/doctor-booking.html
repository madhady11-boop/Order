<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حجز مراجع</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div id="root"></div><script src="../assets/js/app.js"></script><script>if(requireUser()){document.getElementById('root').innerHTML=layout(`<div class="section-title"><h2>👨‍⚕️ حجز مراجع</h2></div><div class="card"><form class="form" onsubmit="book(event)"><div class="field"><label>الاختصاص</label><select id="specialty"><option>باطنية</option><option>أطفال</option><option>أسنان</option><option>أنف وأذن وحنجرة</option><option>عيون</option><option>جلدية</option><option>عظام</option><option>نسائية</option></select></div><div class="field"><label>اسم الطبيب</label><input id="doctor" required placeholder="اسم الطبيب"></div><div class="field"><label>اسم المراجع</label><input id="patient" required></div><div class="field"><label>رقم هاتف المراجع</label><input id="pPhone" required></div><div class="grid"><div class="field"><label>التاريخ</label><input id="date" type="date" required></div><div class="field"><label>الساعة</label><input id="time" type="time" required></div></div><div class="field"><label>ملاحظات</label><textarea id="notes" placeholder="أي ملاحظة للكابتن أو العيادة"></textarea></div><button class="btn btn-primary">إرسال طلب الحجز</button></form></div>`,'home');function book(e){e.preventDefault();const o=addOrder({type:'حجز مراجع',status:'بانتظار تأكيد الموعد',specialty:document.getElementById('specialty').value,doctor:document.getElementById('doctor').value,patient:document.getElementById('patient').value,phone:document.getElementById('pPhone').value,date:document.getElementById('date').value,time:document.getElementById('time').value,notes:document.getElementById('notes').value,total:5000,captain:null});location.href='order-details.html?id='+o.id}}</script></body></html>
