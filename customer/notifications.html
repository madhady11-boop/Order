<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإشعارات</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div id="root"></div><script src="../assets/js/app.js"></script><script>if(requireUser()){document.getElementById('root').innerHTML=layout(`<div class="section-title"><h2>🔔 الإشعارات</h2><button class="btn btn-light" onclick="clearN()">مسح</button></div><div class="list">${state.notifications.length?state.notifications.map(n=>`<div class="card"><b>🔔 ${esc(n.text)}</b><div class="muted" style="margin-top:6px">${esc(n.time)}</div></div>`).join(''):'<div class="card">لا توجد إشعارات.</div>'}</div>`,'notifications');function clearN(){state.notifications=[];save();location.reload()}}</script></body></html>
