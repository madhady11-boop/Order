<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل الطلب</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div id="root"></div><script src="../assets/js/app.js"></script><script>if(requireUser()){const id=new URLSearchParams(location.search).get('id'),o=state.orders.find(x=>x.id===id);if(!o){location.href='orders.html'}else{let extra=o.type==='تسوكلي هنا'?`<p><b>العنوان:</b> ${esc(o.address)}</p><p><b>الطلب:</b> ${o.items.map(x=>`${esc(x.name)} × ${x.qty}`).join('، ')}</p>`:o.type==='توصيل حر'?`<p><b>المحل:</b> ${esc(o.shop)}</p><p><b>من:</b> ${esc(o.from)}</p><p><b>إلى:</b> ${esc(o.to)}</p><p><b>التفاصيل:</b> ${esc(o.details)}</p>`:`<p><b>الاختصاص:</b> ${esc(o.specialty)}</p><p><b>الطبيب:</b> ${esc(o.doctor)}</p><p><b>المراجع:</b> ${esc(o.patient)}</p><p><b>الموعد:</b> ${esc(o.date)} — ${esc(o.time)}</p>`;document.getElementById('root').innerHTML=layout(`<div class="section-title"><h2>تفاصيل ${o.id}</h2><span class="status accepted">${esc(o.status)}</span></div><div class="card">${extra}<hr><div class="between"><span>الكابتن</span><b>${o.captain||'لم يتم التعيين بعد'}</b></div><div class="between" style="margin-top:8px"><span>الإجمالي</span><b class="price">${money(o.total||0)}</b></div><div class="row" style="margin-top:15px"><a class="btn btn-primary" href="tracking.html?id=${o.id}">🗺️ تتبع الطلب</a><button class="btn btn-light" onclick="printInvoice()">🧾 فاتورة PDF / طباعة</button></div></div>`,'orders');window.printInvoice=function(){window.print()}}}</script></body></html>
