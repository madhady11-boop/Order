<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع الطلب</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div id="root"></div><script src="../assets/js/app.js"></script><script>if(requireUser()){const id=new URLSearchParams(location.search).get('id'),o=state.orders.find(x=>x.id===id)||state.orders.find(x=>!['مكتمل','ملغي'].includes(x.status));document.getElementById('root').innerHTML=layout(o?`<div class="section-title"><h2>🗺️ تتبع ${o.id}</h2><span class="badge">${esc(o.status)}</span></div><div class="card"><div class="map"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=46.17%2C31.00%2C46.25%2C31.08&layer=mapnik&marker=31.05%2C46.21"></iframe></div><div class="section-title"><h3>حالة الرحلة</h3></div><div class="timeline"><div class="step active"><div><b>تم إنشاء الطلب</b><br><span class="muted">تم استلام طلبك</span></div></div><div class="step ${o.captain?'active':''}"><div><b>قبول الكابتن</b><br><span class="muted">${o.captain?esc(o.captain):'بانتظار كابتن قريب'}</span></div></div><div class="step"><div><b>متوجه للاستلام</b></div></div><div class="step"><div><b>استلام الطلب</b></div></div><div class="step"><div><b>متوجه إليك</b></div></div><div class="step"><div><b>تم التسليم</b></div></div></div><div class="notice" style="margin-top:12px">التتبع اللحظي الحقيقي لموقع الكابتن يحتاج Backend وقاعدة بيانات Realtime؛ هذه النسخة تجهز واجهة التتبع بالكامل.</div></div>`:'<div class="card">لا يوجد طلب قيد التتبع.</div>`,'orders')}</script></body></html>
