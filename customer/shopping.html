<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسوكلي هنا</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div id="root"></div><script src="../assets/js/app.js"></script><script>if(requireUser()){function render(){document.getElementById('root').innerHTML=layout(`<div class="section-title"><h2>🛒 تسوكلي هنا</h2><a class="badge" href="cart.html">السلة (${state.cart.reduce((a,b)=>a+b.qty,0)})</a></div><div class="product-grid">${products().map(p=>`<div class="product"><div class="pic">${p.icon}</div><div class="body"><b>${p.name}</b><div class="between" style="margin-top:8px"><span class="price">${money(p.price)}</span><button class="btn btn-primary" style="padding:8px 11px" onclick="add(${p.id})">إضافة</button></div></div></div>`).join('')}</div>`, 'home')}function add(id){const p=products().find(x=>x.id===id),x=state.cart.find(x=>x.id===id);x?x.qty++:state.cart.push({id,qty:1});save();toast(`تمت إضافة ${p.name}`);render()}render()}</script></body></html>
