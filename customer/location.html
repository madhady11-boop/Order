<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديد الموقع</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div id="root"></div><script src="../assets/js/app.js"></script><script>if(requireUser()){const params=new URLSearchParams(location.search),type=params.get('type')||'shopping';document.getElementById('root').innerHTML=layout(`<div class="section-title"><h2>📍 تحديد موقع التسليم</h2></div><div class="card"><div class="map"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=46.17%2C31.00%2C46.25%2C31.08&layer=mapnik&marker=31.05%2C46.21"></iframe></div><div class="row" style="margin-top:10px"><button class="btn btn-light" onclick="geo()">استخدم موقعي الحالي</button><span id="gps" class="muted">يمكنك تحريك/تغيير الموقع لاحقًا عند ربط خرائط تفاعلية.</span></div></div><div class="card" style="margin-top:14px"><div class="form"><div class="field"><label>العنوان التفصيلي</label><input id="address" placeholder="مثلاً: حي ... شارع ... قرب ..."></div><div class="field"><label>أقرب نقطة دالة</label><input id="landmark" placeholder="جامع / مدرسة / محل..."></div><button class="btn btn-green" onclick="confirmOrder()">تأكيد الطلب</button></div></div>`,'home');function geo(){if(!navigator.geolocation){toast('المتصفح لا يدعم تحديد الموقع');return}navigator.geolocation.getCurrentPosition(p=>document.getElementById('gps').textContent=`تم تحديد موقعك: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`,()=>toast('تعذر الوصول للموقع'))}function confirmOrder(){const a=document.getElementById('address').value.trim();if(!a){toast('اكتب العنوان أولاً');return}let subtotal=0;state.cart.forEach(x=>{const p=products().find(p=>p.id===x.id);subtotal+=p.price*x.qty});const o=addOrder({type:'تسوكلي هنا',status:'بانتظار كابتن',customer:state.user.name,phone:state.user.phone,address:a,landmark:document.getElementById('landmark').value,subtotal,delivery:2000,total:subtotal+2000,captain:null,items:state.cart.map(x=>({...x,name:products().find(p=>p.id===x.id).name,price:products().find(p=>p.id===x.id).price}))});state.cart=[];save();location.href='order-details.html?id='+o.id}}</script></body></html>
