<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق OTP</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="auth"><div class="auth-card"><div class="auth-logo"><div class="logo">🔐</div><h1>رمز التحقق</h1><p>أدخل الرمز المرسل عبر Telegram Bot</p></div><div class="notice">لأغراض التشغيل التجريبي استخدم الرمز: <b>123456</b></div><form class="form" style="margin-top:15px" onsubmit="verify(event)"><div class="field"><label>رمز OTP</label><input id="otp" inputmode="numeric" maxlength="6" required></div><button class="btn btn-primary">تأكيد وإنشاء الحساب</button></form></div></div><script src="../assets/js/app.js"></script><script>function verify(e){e.preventDefault();if(document.getElementById('otp').value!=='123456'){toast('الرمز غير صحيح');return}const p=JSON.parse(localStorage.getItem('pendingCustomer')||'null');if(!p){location.href='register.html';return}state.user={name:p.name,phone:p.phone,password:p.password,createdAt:new Date().toLocaleDateString('ar-IQ')};save();localStorage.removeItem('pendingCustomer');addNotification('أهلًا بك في وصلني بطريقك 🎉');location.href='home.html'}</script></body></html>
