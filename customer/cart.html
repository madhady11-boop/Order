<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div id="root"></div><script src="../assets/js/app.js"></script><script>if(requireUser()){function render(){let sub=0;const rows=state.cart.map(x=>{const p=products().find(p=>p.id===x.id);sub+=p.price*x.qty;return `<div class="order"><div class="between"><b>${p.icon} ${p.name}</b><span class="price">${money(p.price*x.qty)}</span></div><div class="qty" style="margin-top:10px"><button onclick="chg(${x.id},-1)">−</button><span>${x.qty}</span><button onclick="chg(${x.id},1)">+</button><button class="btn btn-danger" style="padding:6px 9px;margin-right:auto" onclick="removeItem(${x.id})">حذف</button></div></div>`}).join('');const delivery=sub?2000:0;document.getElementById('root').innerHTML=layout(`<div class="section-title"><h2>🛒 سلة المشتريات</h2></div>${rows||'<div class="card" style="text-align:center">السلة فارغة.</div>'}${sub?`<div class="card" style="margin-top:14px"><div class="between"><span>مجموع المنتجات</span><b>${money(sub)}</b></div><div class="between" style="margin-top:8px"><span>أجرة التوصيل التقديرية</span><b>${money(delivery)}</b></div><hr><div class="between"><b>المجموع</b><b class="price">${money(sub+delivery)}</b></div><a class="btn btn-primary" style="display:block;text-align:center;margin-top:12px" href="location.html?type=shopping">تحديد موقع التسليم</a></div>`:''}`,'home')}function chg(id,d){const x=state.cart.find(x=>x.id===id);x.qty=Math.max(1,x.qty+d);save();render()}function removeItem(id){state.cart=state.cart.filter(x=>x.id!==id);save();render()}render()}</script></body></html>
