<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | وصلني بطريقك</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="auth"><div class="auth-card"><div class="auth-logo"><div class="logo">🚗</div><h1>وصلني بطريقك</h1><p>تسجيل دخول الزبون</p></div><form class="form" onsubmit="login(event)"><div class="field"><label>رقم الهاتف</label><input id="phone" required placeholder="07xxxxxxxxx"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn btn-primary">تسجيل الدخول</button></form><div style="text-align:center;margin-top:15px">ما عندك حساب؟ <a style="color:#1688e8;font-weight:900" href="register.html">إنشاء حساب</a></div><div class="notice" style="margin-top:15px">نسخة تشغيل أولية: بيانات الحساب محفوظة على جهازك. ربط OTP الحقيقي مع Telegram يحتاج Backend/Bot Token.</div></div></div><script src="../assets/js/app.js"></script><script>function login(e){e.preventDefault();const p=document.getElementById('phone').value.trim(),pw=document.getElementById('password').value;if(!state.user||state.user.phone!==p||state.user.password!==pw){toast('رقم الهاتف أو كلمة المرور غير صحيحة');return}location.href='home.html'}</script></body></html>
