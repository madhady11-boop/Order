<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div id="root"></div><script src="../assets/js/app.js"></script><script>if(requireUser()){const rows=state.orders.length?state.orders.map(o=>`<a class="order" href="order-details.html?id=${o.id}"><div class="between"><b>${esc(o.type)}</b><span class="status ${o.status==='مكتمل'?'done':o.status==='ملغي'?'cancelled':'accepted'}">${esc(o.status)}</span></div><div class="muted" style="margin-top:7px">${o.id} • ${o.createdAt}</div><div class="between" style="margin-top:9px"><span>${o.captain?`🧑‍✈️ ${esc(o.captain)}`:'بانتظار الكابتن'}</span><b>${money(o.total||0)}</b></div></a>`).join(''):'<div class="card" style="text-align:center">ما عندك طلبات لحد الآن.</div>';document.getElementById('root').innerHTML=layout(`<div class="section-title"><h2>📦 طلباتي</h2><span class="badge">${state.orders.length} طلب</span></div><div class="list">${rows}</div>`,'orders')}</script></body></html>
