<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>توصيل حر</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div id="root"></div><script src="../assets/js/app.js"></script><script>if(requireUser()){document.getElementById('root').innerHTML=layout(`<div class="section-title"><h2>📦 توصيل حر</h2></div><div class="card"><form class="form" onsubmit="send(event)"><h3>مكان الاستلام</h3><div class="field"><label>اسم المحل</label><input id="shop" required></div><div class="field"><label>عنوان المحل</label><input id="from" required></div><div class="field"><label>أقرب نقطة دالة</label><input id="fromLandmark"></div><h3 style="margin-top:10px">تفاصيل الطلب</h3><div class="field"><label>شنو تريد من المحل؟</label><textarea id="details" required placeholder="اكتب الطلب بالتفصيل..."></textarea></div><h3>مكان التسليم</h3><div class="field"><label>عنوان الوصول</label><input id="to" required></div><div class="field"><label>أقرب نقطة دالة</label><input id="toLandmark"></div><div class="notice">السعر النهائي للتوصيل يحدده النظام حسب المسافة. إذا اختلف السعر أو المنتج، الكابتن يرسل لك طلب موافقة داخل التطبيق.</div><button class="btn btn-primary">إرسال طلب التوصيل</button></form></div>`,'home');function send(e){e.preventDefault();const o=addOrder({type:'توصيل حر',status:'بانتظار كابتن',shop:document.getElementById('shop').value,from:document.getElementById('from').value,fromLandmark:document.getElementById('fromLandmark').value,details:document.getElementById('details').value,to:document.getElementById('to').value,toLandmark:document.getElementById('toLandmark').value,delivery:2500,total:2500,captain:null});location.href='order-details.html?id='+o.id}}</script></body></html>
