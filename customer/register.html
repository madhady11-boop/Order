<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="auth"><div class="auth-card"><div class="auth-logo"><div class="logo">🚗</div><h1>إنشاء حساب زبون</h1><p>سجل بياناتك حتى تبدأ الطلب</p></div><form class="form" onsubmit="register(event)"><div class="field"><label>الاسم الكامل</label><input id="name" required></div><div class="field"><label>رقم الهاتف</label><input id="phone" required placeholder="07xxxxxxxxx"></div><div class="field"><label>كلمة المرور</label><input id="pw" type="password" minlength="6" required></div><div class="field"><label>تأكيد كلمة المرور</label><input id="pw2" type="password" required></div><button class="btn btn-yellow">متابعة للتحقق OTP</button></form><div style="text-align:center;margin-top:15px"><a href="login.html">لدي حساب بالفعل</a></div></div></div><script src="../assets/js/app.js"></script><script>function register(e){e.preventDefault();const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),pw=document.getElementById('pw').value,pw2=document.getElementById('pw2').value;if(pw!==pw2){toast('كلمتا المرور غير متطابقتين');return}localStorage.setItem('pendingCustomer',JSON.stringify({name,phone,password:pw}));location.href='otp.html'}</script></body></html>
